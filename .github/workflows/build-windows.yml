# Membuat installer Windows di server GitHub, lalu menaruhnya di halaman Releases.
# Berjalan otomatis setiap ada perubahan di branch main, atau manual dari tab Actions.
name: Build installer Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Pasang dependensi
        run: npm ci

      - name: Tes
        run: npm test

      - name: Build dan terbitkan installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Meow Corner v__VERSION__"
          releaseBody: "Unduh file yang berakhiran -setup.exe di bawah ini, lalu klik dua kali untuk memasang Meow Corner."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
